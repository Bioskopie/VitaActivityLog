name: Build PS Vita Activity Log

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert LiveArea PNGs to PS Vita 8-bit Indexed Format
        run: |
          apt-get update && apt-get install -y pngquant imagemagick || true
          if [ -f "sce_sys/icon0.png" ]; then
            convert "sce_sys/icon0.png" -resize 128x128\! "sce_sys/icon0.png" || true
            pngquant --force --ext .png 256 "sce_sys/icon0.png" || true
          fi
          if [ -f "sce_sys/startup.png" ]; then
            convert "sce_sys/startup.png" -resize 284x128\! "sce_sys/startup.png" || true
            pngquant --force --ext .png 256 "sce_sys/startup.png" || true
          fi
          if [ -f "sce_sys/livearea/contents/bg.png" ]; then
            convert "sce_sys/livearea/contents/bg.png" -resize 840x500\! "sce_sys/livearea/contents/bg.png" || true
            pngquant --force --ext .png 256 "sce_sys/livearea/contents/bg.png" || true
          fi

      - name: Compile VPK and SUPRX Plugin
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Upload Compiled Vita Files
        uses: actions/upload-artifact@v4
        with:
          name: VitaActivityLog-Release
          path: |
            build/VitaActivityLog.vpk
            build/activity_log.suprx
